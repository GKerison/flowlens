name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # upload-artifact 的元数据在 Actions API 里有短暂的可见延迟，
      # deploy-pages 紧接着查会偶发 "Found 0 artifact(s)"；等待后再部署。
      - name: Wait for artifact metadata
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
