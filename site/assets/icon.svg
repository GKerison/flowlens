<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2a46"/>
      <stop offset="0.5" stop-color="#0a1c34"/>
      <stop offset="1" stop-color="#061524"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ce0ff"/>
      <stop offset="0.45" stop-color="#3f8bff"/>
      <stop offset="1" stop-color="#2ee6b0"/>
    </linearGradient>
    <linearGradient id="streamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38a0ff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#59d5ff"/>
      <stop offset="0.62" stop-color="#d4f7ff"/>
      <stop offset="1" stop-color="#59d5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6b0" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#2ee6b0"/>
      <stop offset="0.68" stop-color="#a9fff0"/>
      <stop offset="1" stop-color="#2ee6b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.36" stop-color="#9defff"/>
      <stop offset="0.75" stop-color="#2f9bff"/>
      <stop offset="1" stop-color="#144fc0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="496" height="496" rx="112"/>
    </clipPath>
  </defs>

  <!-- 底板：深蓝，圆角与系统应用图标一致 -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#clip)" opacity="0.16" stroke="#4b9fd8" stroke-width="2">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#rim)" stroke-opacity="0.55" stroke-width="4"/>

  <!-- 观察之眼：两条弧线构成镜头轮廓，寓意「观」 -->
  <path d="M56 256 C140 148 372 148 456 256 C372 364 140 364 56 256 Z"
        fill="#0b2540" fill-opacity="0.85" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 数据流：从左侧汇入镜头，穿过焦点后向右侧发散，寓意「流」 -->
  <g fill="none" stroke-linecap="round">
    <path d="M44 204 C152 204 172 318 268 268 S388 200 468 214" stroke="url(#streamA)" stroke-width="10" filter="url(#glow)"/>
    <path d="M44 308 C152 308 172 194 268 244 S388 312 468 298" stroke="url(#streamB)" stroke-width="10" filter="url(#glow)"/>
    <path d="M52 256 C164 256 196 256 460 256" stroke="#e9fbff" stroke-opacity="0.9" stroke-width="6"/>
  </g>

  <!-- 焦点：被观测的数据包 -->
  <circle cx="256" cy="256" r="74" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="#d6f6ff" stroke-opacity="0.9" stroke-width="5"/>
  <circle cx="256" cy="256" r="40" fill="#0a2440" fill-opacity="0.92"/>
  <circle cx="256" cy="256" r="18" fill="#e9fbff"/>
  <circle cx="234" cy="232" r="9" fill="#ffffff" fill-opacity="0.95"/>

  <!-- 行进中的数据包节点 -->
  <g fill="#d9f8ff">
    <rect x="130" y="190" width="18" height="18" rx="5" transform="rotate(-18 139 199)"/>
    <rect x="352" y="216" width="20" height="20" rx="5" transform="rotate(14 362 226)"/>
    <rect x="146" y="300" width="18" height="18" rx="5" transform="rotate(16 155 309)"/>
    <rect x="372" y="292" width="16" height="16" rx="4" transform="rotate(-12 380 300)"/>
  </g>
</svg>
